<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>innerText - innerHTML</title>
</head>
<body>
    <h1>innerText - innerHTML</h1>
    <button onclick="fn_innerText()">innerText</button>
    <button onclick="fn_innerHTML()">innerHTML</button>
    <button onclick="fn_getcontent()">Get content</button>
    <div id="text"></div>
    <hr>
    <div id="html"></div>

    <script>
        const fn_innerText = ()=>{
            document.getElementById("text").innerText = "Nội dung văn bản.";
        }

        const fn_innerHTML = () => {
            document.getElementById("html").innerHTML = "<h2>Nội dung văn bản.<h2>";
        }

        const fn_getcontent = ()=>{
            let content = document.getElementById("html").innerHTML;
            alert("html:"+content);
            content = document.getElementById("html").innerText;
            alert("text:"+content);
        }
    </script>
</body>
</html>
