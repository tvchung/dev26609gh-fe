                <th>Header 3</th>

                <td>Nội dụng dòng 2 cột 2</td>
                <td>Nội dụng dòng 2 cột 3</td>
                <td>Nội dụng dòng 2 cột 4</td>
            </tr>
            <tr>
                <td>Nội dung dòng 3 cột 1</td>
                <td>Nội dung dòng 3 cột 2</td>
                <td>Nội dung dòng 3 cột 3</td>
                <td>Nội dung dòng 3 cột 4</td>
            </tr>
        </tbody>

        <tfoot>

        </tfoot>
    </table>
</body>
</html>
