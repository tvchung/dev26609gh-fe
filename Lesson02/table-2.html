<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table - Các thuộc  tính thường dùng</title>
</head>
<body>
    <h1>Table - Các thuộc  tính thường dùng</h1>
    <table border="1" width="90%" align="center">
        <thead bgcolor="#ddd">
            <tr>
                <th rowspan="2">#</th>
                <th rowspan="2">Họ và tên</th>
                <th colspan="3" bgcolor="blue">Điểm</th>
            </tr>
            <tr bgcolor="green" style="color:yellow">
                <th>Toán</th>
                <th>Văn</th>
                <th>Anh</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td align="center">1001</td>
                <td>Nguyễn văn A</td>
                <td align="right">10</td>
                <td align="right">9</td>
                <td align="right">10</td>
            </tr>
            <tr>
                <td align="center">1001</td>
                <td>Nguyễn văn B</td>
                 <td align="right">10</td>
                <td align="right">9</td>
                <td align="right">10</td>
            </tr>
            <tr>
                <td align="center">1001</td>
                <td>Nguyễn thị C</td>
                <td align="right">10</td>
                <td align="right">9</td>
                <td align="right">10</td>
            </tr>
            <tr>
                <td align="center">1001</td>
                <td>Nguyễn thị D</td>
                <td align="right">10</td>
                <td align="right">9</td>
                <td align="right">10</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="2">Điểm trung bình:</th>
                <th>....</th>
                <th>....</th>
                <th>....</th>
            </tr>
        </tfoot>
    </table>
</body>
</html>
